<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stepsy · Upload your steps</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 620px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            margin: 0;
            font-size: 42px;
        }

        .brand p {
            margin: 8px 0 0;
            color: #6b7280;
            font-size: 17px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
        }

        .upload-icon {
            font-size: 42px;
            margin-bottom: 14px;
        }

        .upload-area h2 {
            margin: 0;
            font-size: 20px;
        }

        .upload-area p {
            color: #6b7280;
        }

        input[type="file"] {
            display: none;
        }

        .browse-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #e5e7eb;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        #file-name {
            text-align: center;
            margin-top: 18px;
            font-weight: 600;
        }

        .upload-button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .upload-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #result {
            display: none;
            margin-top: 24px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
        }

        #result.success {
            display: block;
            background: #ecfdf5;
            border: 2px solid #22c55e;
            color: #166534;
        }

        #result.error {
            display: block;
            background: #fef2f2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }

        .result-icon {
            display: block;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .grafana-button {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #f97316;
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        .grafana-button:hover {
            opacity: 0.9;
        }

        .info {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <h1>Stepsy</h1>
        <p>Import your walking data</p>
    </div>

    <div class="card">

        <form id="upload-form">

            <div class="upload-area">

                <div class="upload-icon">📂</div>

                <h2>Upload your Stepsy CSV file</h2>

                <p>Select the CSV file exported from Stepsy.</p>

                <label class="browse-button">
                    Choose CSV file

                    <input
                        type="file"
                        id="file-input"
                        accept=".csv"
                    >
                </label>

            </div>

            <div id="file-name"></div>

            <button
                type="submit"
                class="upload-button"
                id="upload-button"
                disabled
            >
                Upload your data
            </button>

        </form>

        <div id="result"></div>

        <div class="info">
            Your data will be imported into InfluxDB and become available in your Stepsy dashboard.
        </div>

    </div>

</div>

<script>
    const form = document.getElementById("upload-form");
    const fileInput = document.getElementById("file-input");
    const fileName = document.getElementById("file-name");
    const uploadButton = document.getElementById("upload-button");
    const result = document.getElementById("result");

    const grafanaUrl =
        window.location.protocol +
        "//" +
        window.location.hostname +
        ":{{ grafana_port }}";

    fileInput.addEventListener("change", function () {

        if (fileInput.files.length > 0) {

            fileName.textContent =
                "Selected file: " + fileInput.files[0].name;

            uploadButton.disabled = false;

            result.style.display = "none";
            result.className = "";
        }

    });


    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const file = fileInput.files[0];

        if (!file) {
            return;
        }

        uploadButton.disabled = true;
        uploadButton.textContent = "Uploading...";

        result.style.display = "none";
        result.className = "";

        const formData = new FormData();

        formData.append("file", file);

        try {

            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error("Upload failed");
            }

            result.innerHTML =
                '<span class="result-icon">✅</span>' +
                'Upload successful!<br>' +
                data.points + ' data points were imported.' +
                '<br>' +
                '<a class="grafana-button" href="' + grafanaUrl +
                '" target="_blank" rel="noopener noreferrer">' +
                'View your Grafana dashboard →' +
                '</a>';

            result.className = "success";
            result.style.display = "block";

            fileInput.value = "";
            fileName.textContent = "";

        } catch (error) {

            result.innerHTML =
                '<span class="result-icon">❌</span>' +
                'Upload failed.<br>' +
                'Please check your CSV file and try again.';

            result.className = "error";
            result.style.display = "block";

        } finally {

            uploadButton.disabled = true;
            uploadButton.textContent = "Upload your data";

        }

    });
</script>

</body>
</html>
